# PocketMate nginx site (see docs/deployment.md).
# Copy to /etc/nginx/sites-available/pocketmate, replacing pokemon.example.org,
# then: ln -s ../sites-available/pocketmate /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS is added afterwards by: certbot --nginx -d pokemon.example.org
#
# The WebSocket "Connection" header uses the map $connection_upgrade, already declared by the Planecircle site on the
# same nginx: it is NOT redeclared here (nginx refuses a duplicate). On a machine without it, add once, in http:
#     map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Cache of the TCGdex images relayed by /tcgdex/ (players whose network blocks assets.tcgdex.net): each image is asked
# of TCGdex once. An image unused for 60 days is forgotten.
proxy_cache_path /var/cache/nginx/pocketmate-tcgdex levels=1:2 keys_zone=pocketmate_tcgdex:10m max_size=2g inactive=60d use_temp_path=off;

# The security headers of the pages (nosniff, X-Frame-Options…) come from the Node server. Once certbot has added
# HTTPS, in the "listen 443" block:
#     add_header Strict-Transport-Security "max-age=31536000" always;

server {
    listen 80;
    listen [::]:80;
    server_name pokemon.example.org;

    # Online play: WebSocket. Long timeout: a game can stay quiet for minutes (the server pings every 25 s anyway).
    location /ws {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The player's real address (per-address caps of the server): X-Forwarded-For can be filled by the client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # TCGdex images relayed by the application (allow-list in server/src/index.ts), cached by nginx.
    location /tcgdex/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache pocketmate_tcgdex;
        proxy_cache_key $scheme$host$uri;
        proxy_cache_valid 200 60d;
        proxy_cache_valid 404 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status;
    }

    # Interface (files of the built client) and /healthz.
    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
